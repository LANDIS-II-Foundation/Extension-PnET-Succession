name: Version Bump

permissions:
  contents: write
  actions: write
  id-token: write

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type (patch, minor, major)"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major
      base_version:
        description: "Optional base version (e.g., 6.1.1). If empty, latest tag is used."
        required: false
      notes:
        description: "Release notes / description for this version"
        required: false

jobs:
  bump:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Determine starting version
        id: startver
        run: |
          if [ -n "${{ github.event.inputs.base_version }}" ]; then
            echo "base=${{ github.event.inputs.base_version }}" >> $GITHUB_OUTPUT
          else
            latest=$(git tag --list "v*" | sort -V | tail -n 1)
            latest="${latest#v}"
            echo "base=$latest" >> $GITHUB_OUTPUT
          fi

      - name: Compute bumped version
        id: bumpver
        run: |
          base="${{ steps.startver.outputs.base }}"
          bump="${{ github.event.inputs.bump }}"

          arr=(${base//./ })
          major=${arr[0]}
          minor=${arr[1]}
          patch=${arr[2]}

          case "$bump" in
            major) major=$((major+1)); minor=0; patch=0 ;;
            minor) minor=$((minor+1)); patch=0 ;;
            patch) patch=$((patch+1)) ;;
          esac

          next="$major.$minor.$patch"
          echo "next=$next" >> $GITHUB_OUTPUT

      - name: Push new version tag
        run: |
          next="${{ steps.bumpver.outputs.next }}"
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag "v$next"
          git push origin "v$next"

      - name: Trigger Build-Release workflow with notes
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "build-release.yml",
              ref: context.ref.replace("refs/heads/", ""),
              inputs: {
                version: "${{ steps.bumpver.outputs.next }}",
                notes: "${{ github.event.inputs.notes }}"
              }
            });
